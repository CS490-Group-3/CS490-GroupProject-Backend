---
tags:
  - Salon

summary: Submit an appeal for a rejected salon application
description: >
  Allows an authenticated salon_owner to appeal a previously rejected salon application.
  Supports optional resubmission of updated fields and new logo/license uploads.

consumes:
  - multipart/form-data
produces:
  - application/json

parameters:
  - in: header
    name: Authorization
    required: true
    description: Bearer access token
    type: string

  - in: path
    name: salon_id
    type: string
    required: true
    description: The salon ID being appealed
    example: b534633a-23bc-4479-968f-8a004615821c

  # ---- Allowed editable fields ----
  - in: formData
    name: name
    type: string
    required: false
    description: Optional updated salon name
    example: "Swag Shop Reloaded"

  - in: formData
    name: description
    type: string
    required: false
    description: Optional updated description
    example: "Updated application with corrected license info."

  - in: formData
    name: address
    type: string
    required: false
    example: "123 Main Street"

  - in: formData
    name: phone_number
    type: string
    required: false
    example: "9735559999"

  # ---- File uploads ----
  - in: formData
    name: logo
    type: file
    required: false
    description: Optional updated salon logo

  - in: formData
    name: license
    type: file
    required: false
    description: Optional updated business license

responses:
  200:
    description: Appeal submitted successfully
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Appeal submitted successfully"
        new_status:
          type: string
          example: "pending"

  400:
    description: Bad request
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Appeals are only allowed for rejected salons."

  403:
    description: Forbidden
    schema:
      type: object
      properties:
        error:
          type: string
          example: "You are not authorized to appeal this salon."

  404:
    description: Salon not found
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Salon not found"

  500:
    description: Internal server error
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Unexpected error occurred while submitting appeal."


---
tags:
  - Admin
summary: Get retention metrics
description: >
  Retrieve customer retention metrics for a date range including returning customers,
  new customers, and retention rate.
parameters:
  - in: header
    name: Authorization
    required: true
    schema:
      type: string
  - in: query
    name: start_date
    required: true
    schema:
      type: string
      format: date
    example: "2024-01-01"
  - in: query
    name: end_date
    required: true
    schema:
      type: string
      format: date
    example: "2024-01-31"
responses:
  200:
    description: Retention metrics retrieved successfully
    schema:
      type: object
  400:
    description: Bad request
  403:
    description: Forbidden
  500:
    description: Internal server error


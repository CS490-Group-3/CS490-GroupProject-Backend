---
tags:
  - Appointments
summary: Mark appointment as completed or no_show
description: >
  Allows barbers, salon owners, or admins to mark an appointment as completed or no_show.
consumes:
  - application/json
produces:
  - application/json
parameters:
  - in: header
    name: Authorization
    required: true
    type: string
    example: "Bearer eyJhbGciOi..."

  - in: path
    name: appointment_id
    type: string
    required: true
    example: "a1b2c3"

  - in: body
    name: body
    required: false
    schema:
      type: object
      properties:
        status:
          type: string
          enum: [completed, no_show]
          default: completed
          example: "completed"

responses:
  200:
    description: Appointment status updated
    schema:
      type: object
      properties:
        id: { type: string, example: "a1b2c3" }
        status: { type: string, example: "completed" }

  400:
    description: Invalid status or request
    schema:
      type: object
      properties:
        error: { type: string, example: "Invalid status" }

  403:
    description: Forbidden
    schema:
      type: object
      properties:
        error: { type: string, example: "Forbidden" }

  404:
    description: Not found
    schema:
      type: object
      properties:
        error: { type: string, example: "Appointment not found" }

  500:
    description: Server error
    schema:
      type: object
      properties:
        error: { type: string, example: "Internal server error" }

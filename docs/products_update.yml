---
tags:
  - Products
summary: Update a product
description: >
  Update product details. Only salon owners can update products for their salon.
  Supports both JSON and multipart/form-data (for image uploads).
consumes:
  - application/json
  - multipart/form-data
produces:
  - application/json
parameters:
  - in: header
    name: Authorization
    type: string
    required: true
    description: Bearer access token
    example: "Bearer eyJhbGciOi..."

  - in: path
    name: product_id
    type: string
    format: uuid
    required: true
    description: Product UUID
    example: "a1234567-89ab-cdef-0123-456789abcdef"

  - in: formData
    name: name
    type: string
    required: false
    description: Product name (when using multipart/form-data)
    example: "Hair Gel"
  
  - in: formData
    name: description
    type: string
    required: false
    description: Product description (when using multipart/form-data)
    example: "Premium styling gel"
  
  - in: formData
    name: price
    type: string
    required: false
    description: Product price (when using multipart/form-data)
    example: "15.99"
  
  - in: formData
    name: category_id
    type: string
    format: uuid
    required: false
    description: Category ID (when using multipart/form-data)
  
  - in: formData
    name: stock_quantity
    type: integer
    required: false
    description: Stock quantity (when using multipart/form-data)
  
  - in: formData
    name: is_active
    type: boolean
    required: false
    description: Whether product is active (when using multipart/form-data)
  
  - in: formData
    name: file
    type: file
    required: false
    description: Product image file (when using multipart/form-data)

  - in: body
    name: body
    required: false
    description: JSON body (when not using multipart/form-data)
    schema:
      type: object
      properties:
        name:
          type: string
          example: "Hair Gel"
        description:
          type: string
          example: "Premium styling gel"
        price:
          type: string
          example: "15.99"
        category_id:
          type: string
          format: uuid
        stock_quantity:
          type: integer
        is_active:
          type: boolean
          example: true
        image_url:
          type: string
          description: Image URL (if updating without uploading new file)

responses:
  200:
    description: Product updated successfully
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Product updated successfully"
        product:
          type: object

  400:
    description: Validation error
  403:
    description: Forbidden - not the salon owner
  404:
    description: Product not found
  401:
    description: Unauthorized
  500:
    description: Server error




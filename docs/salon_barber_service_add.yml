---
tags:
  - Salon
summary: Add a service to a barber
description: >
  Assigns a service to a barber. Validates that the salon owner owns the salon,
  the barber belongs to the salon, and the service belongs to the salon.
  Only salon owners and admins may perform this action.
consumes:
  - application/json
produces:
  - application/json
parameters:
  - in: header
    name: Authorization
    type: string
    required: true
    description: Bearer access token
    example: "Bearer eyJhbGciOi..."

  - in: path
    name: salon_id
    type: string
    format: uuid
    required: true
    description: Salon UUID
    example: "b534633a-23bc-4479-968f-8a004615821c"

  - in: path
    name: barber_id
    type: string
    format: uuid
    required: true
    description: Barber UUID
    example: "a1234567-89ab-cdef-0123-456789abcdef"

  - in: body
    name: body
    required: true
    schema:
      type: object
      required: [service_id]
      properties:
        service_id:
          type: string
          format: uuid
          description: Service UUID to assign to the barber
          example: "f9876543-21ba-fedc-3210-fedcba987654"

responses:
  201:
    description: Service added to barber successfully
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Service added to barber successfully"

  400:
    description: Validation error or business logic error
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Service is already assigned to this barber"

  403:
    description: Forbidden - salon ownership or access denied
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Forbidden: You don't own this salon"

  404:
    description: Salon, barber, or service not found
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Barber not found"

  500:
    description: Server error
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Unexpected error occurred"


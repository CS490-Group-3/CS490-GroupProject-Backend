---
tags:
  - Orders
summary: Checkout and process payment
description: >
  Process payment for an order and complete checkout. Supports saved payment methods, new cards, and loyalty point redemption.
consumes:
  - application/json
produces:
  - application/json
parameters:
  - in: header
    name: Authorization
    type: string
    required: true
    description: Bearer access token
    example: "Bearer eyJhbGciOi..."

  - in: body
    name: body
    required: true
    schema:
      type: object
      required: [order_id]
      properties:
        order_id:
          type: string
          format: uuid
          description: Order UUID
          example: "a1234567-89ab-cdef-0123-456789abcdef"
        shipping_address:
          type: string
          description: Shipping address
          example: "123 Main St, City, State 12345"
        payment_method_id:
          type: string
          format: uuid
          description: Saved payment method ID (optional if providing new card)
          example: "d1234567-89ab-cdef-0123-456789abcdef"
        card_number:
          type: string
          description: New card number (optional if using saved method)
          example: "4111111111111111"
        exp_month:
          type: integer
          description: Expiration month (1-12)
          example: 12
        exp_year:
          type: integer
          description: Expiration year (4 digits)
          example: 2025
        cvv:
          type: string
          description: CVV code
          example: "123"
        cardholder_name:
          type: string
          description: Cardholder name
          example: "John Doe"
        billing_address:
          type: object
          description: Billing address
          properties:
            line1:
              type: string
              example: "123 Main St"
            line2:
              type: string
              example: "Apt 4B"
            city:
              type: string
              example: "New York"
            state:
              type: string
              example: "NY"
            zip:
              type: string
              example: "10001"
            country:
              type: string
              example: "US"
        save_payment_method:
          type: boolean
          description: Whether to save the new card
          default: false
        redeem_loyalty_points:
          type: boolean
          description: Whether to redeem loyalty points for discount
          default: false

responses:
  200:
    description: Order placed successfully
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Order placed successfully"
        order:
          type: object
          description: Updated order
        payment:
          type: object
          description: Payment record

  400:
    description: Invalid request or payment failed
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Cart is empty"

  401:
    description: Unauthorized
  500:
    description: Server error


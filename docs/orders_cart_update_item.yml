---
tags:
  - Orders
summary: Update cart item quantity
description: >
  Update the quantity of an item in the shopping cart.
consumes:
  - application/json
produces:
  - application/json
parameters:
  - in: header
    name: Authorization
    type: string
    required: true
    description: Bearer access token
    example: "Bearer eyJhbGciOi..."

  - in: path
    name: item_id
    type: string
    format: uuid
    required: true
    description: Order item UUID
    example: "c1234567-89ab-cdef-0123-456789abcdef"

  - in: body
    name: body
    required: true
    schema:
      type: object
      required: [order_id, quantity]
      properties:
        order_id:
          type: string
          format: uuid
          description: Order UUID
          example: "a1234567-89ab-cdef-0123-456789abcdef"
        quantity:
          type: integer
          minimum: 1
          description: New quantity
          example: 3

responses:
  200:
    description: Item updated successfully
    schema:
      type: object
      properties:
        item:
          type: object
          description: The updated order item
        message:
          type: string
          example: "Item updated"

  400:
    description: Invalid request
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Quantity must be at least 1"

  401:
    description: Unauthorized
  500:
    description: Server error


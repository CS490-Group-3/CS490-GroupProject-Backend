---
tags:
  - Orders
summary: Get salon orders (owner only)
description: >
  Get all orders for a salon. Only accessible by the salon owner.
produces:
  - application/json
parameters:
  - in: header
    name: Authorization
    type: string
    required: true
    description: Bearer access token
    example: "Bearer eyJhbGciOi..."

  - in: path
    name: salon_id
    type: string
    format: uuid
    required: true
    description: Salon ID
    example: "a1234567-89ab-cdef-0123-456789abcdef"

  - in: query
    name: status
    type: string
    enum: [pending, confirmed, processing, shipped, delivered, cancelled]
    required: false
    description: Filter by order status
    example: "confirmed"

  - in: query
    name: limit
    type: integer
    required: false
    default: 50
    description: Maximum number of results
    example: 50

  - in: query
    name: offset
    type: integer
    required: false
    default: 0
    description: Number of results to skip
    example: 0

responses:
  200:
    description: List of orders
    schema:
      type: object
      properties:
        orders:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              user_id:
                type: string
                format: uuid
              salon_id:
                type: string
                format: uuid
              order_status:
                type: string
              subtotal:
                type: number
              total_amount:
                type: number
              items:
                type: array
              customer:
                type: object
                properties:
                  id:
                    type: string
                  first_name:
                    type: string
                  last_name:
                    type: string
                  email:
                    type: string

  403:
    description: Unauthorized - not the salon owner
  404:
    description: Salon not found
  500:
    description: Server error


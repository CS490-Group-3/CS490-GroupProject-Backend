---
tags:
  - Salon
summary: Get current owner's salon
description: >
  Returns the salon where the authenticated user's ID matches `owner_id` (single result).
produces:
  - application/json
parameters:
  - in: header
    name: Authorization
    description: Bearer access token
    required: true
    type: string
responses:
  200:
    description: Owned salon (single)
    schema:
      type: object
      properties:
        salon:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            status:
              type: string
              example: "pending"
            created_at:
              type: string
              format: date-time
            city:
              type: string
            state:
              type: string
            zip_code:
              type: string
  400:
    description: Missing user id
    schema:
      type: object
      properties:
        error:
          type: string
          example: "User ID missing"
  403:
    description: Forbidden for non-owners/admins
    schema:
      type: object
      properties:
        error:
          type: string
  500:
    description: Server error
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Database connection failed"

---
tags:
  - Orders
summary: Remove item from cart
description: >
  Remove an item from the shopping cart.
consumes:
  - application/json
produces:
  - application/json
parameters:
  - in: header
    name: Authorization
    type: string
    required: true
    description: Bearer access token
    example: "Bearer eyJhbGciOi..."

  - in: path
    name: item_id
    type: string
    format: uuid
    required: true
    description: Order item UUID
    example: "c1234567-89ab-cdef-0123-456789abcdef"

  - in: query
    name: order_id
    type: string
    format: uuid
    required: true
    description: Order UUID
    example: "a1234567-89ab-cdef-0123-456789abcdef"

responses:
  200:
    description: Item removed successfully
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Item removed from cart"

  400:
    description: Invalid request
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Missing 'order_id' query parameter"

  401:
    description: Unauthorized
  500:
    description: Server error






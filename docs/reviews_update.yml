---
tags:
  - Reviews
summary: Partially update an existing review
description: >
  Allows an authenticated **customer** to update their own review.  
  Only the provided fields will be modified (PATCH operation).
consumes:
  - application/json
produces:
  - application/json

parameters:
  - in: header
    name: Authorization
    description: Bearer access token
    required: true
    type: string

  - in: path
    name: review_id
    type: string
    format: uuid
    required: true
    description: The ID of the review to update

  - in: body
    name: updates
    description: Fields to update
    required: true
    schema:
      type: object
      properties:
        rating:
          type: integer
        title:
          type: string
        comment:
          type: string

responses:
  200:
    description: Review updated successfully
    schema:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        appointment_id: { type: string, format: uuid }
        salon_id: { type: string, format: uuid }
        rating: { type: integer, minimum: 1, maximum: 5 }
        title: { type: string }
        comment: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
  400:
    description: Invalid request
    schema:
      type: object
      properties:
        error: { type: string, example: "Request body is required" }
  403:
    description: User does not own this review
    schema:
      type: object
      properties:
        error: { type: string, example: "You can only edit your own reviews" }
  404:
    description: Review not found
    schema:
      type: object
      properties:
        error: { type: string, example: "Review not found" }
  500:
    description: Internal server error
    schema:
      type: object
      properties:
        error: { type: string, example: "Internal server error" }


---
tags:
  - Reviews
summary: Create a review for a completed appointment
description: >
  Allows an authenticated **customer** to submit a review for a completed appointment.  
  A customer may only submit one review per appointment.
consumes:
  - application/json
produces:
  - application/json

parameters:
  - in: header
    name: Authorization
    description: Bearer access token
    required: true
    type: string

  - in: body
    name: review
    description: Review data
    required: true
    schema:
      type: object
      properties:
        appointment_id:
          type: string
          format: uuid
        rating:
          type: integer
          minimum: 1
          maximum: 5
        title:
          type: string
        comment:
          type: string

responses:
  201:
    description: Review created successfully
    schema:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        appointment_id: { type: string, format: uuid }
        salon_id: { type: string, format: uuid }
        rating: { type: integer, minimum: 1, maximum: 5 }
        title: { type: string }
        comment: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
  400:
    description: Invalid request, appointment not completed, or review already exists
    schema:
      type: object
      properties:
        error: { type: string, example: "Appointment must be completed before reviewing it" }
  403:
    description: User does not own this appointment
    schema:
      type: object
      properties:
        error: { type: string, example: "You cannot review an appointment you did not book" }
  404:
    description: Appointment not found
    schema:
      type: object
      properties:
        error: { type: string, example: "Appointment not found" }
  500:
    description: Internal server error
    schema:
      type: object
      properties:
        error: { type: string, example: "Internal server error" }


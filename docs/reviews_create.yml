---
tags:
  - Reviews
summary: Create a review for a completed appointment
description: >
  Allows an authenticated **customer** to submit a review for a completed appointment.  
  A customer may only submit one review per appointment.
consumes:
  - application/json
produces:
  - application/json

parameters:
  - in: header
    name: Authorization
    description: Bearer access token
    required: true
    type: string

  - in: body
    name: review
    description: Review data
    required: true
    schema:
      type: object
      properties:
        appointment_id:
          type: string
          format: uuid
        rating:
          type: integer
          minimum: 1
          maximum: 5
        title:
          type: string
        comment:
          type: string

responses:
  201:
    description: Review created successfully
  400:
    description: Invalid request or appointment not completed
  403:
    description: User does not own this appointment
  409:
    description: Review already exists for this appointment
  500:
    description: Internal server error


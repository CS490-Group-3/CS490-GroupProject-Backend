---
tags:
  - Loyalty
summary: Get loyalty transaction history
description: >
  Get loyalty point transaction history for the authenticated user.
  Can be filtered by salon.
produces:
  - application/json
parameters:
  - in: header
    name: Authorization
    type: string
    required: true
    description: Bearer access token
    example: "Bearer eyJhbGciOi..."

  - in: query
    name: salon_id
    type: string
    format: uuid
    required: false
    description: Filter by salon ID
    example: "a1234567-89ab-cdef-0123-456789abcdef"

  - in: query
    name: limit
    type: integer
    required: false
    default: 50
    description: Maximum number of results
    example: 50

  - in: query
    name: offset
    type: integer
    required: false
    default: 0
    description: Number of results to skip
    example: 0

responses:
  200:
    description: List of loyalty transactions
    schema:
      type: object
      properties:
        transactions:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              user_id:
                type: string
                format: uuid
              salon_id:
                type: string
                format: uuid
              transaction_type:
                type: string
                enum: [earned, redeemed, expired]
              points:
                type: integer
              description:
                type: string
              appointment_id:
                type: string
                format: uuid
              payment_id:
                type: string
                format: uuid
              created_at:
                type: string
                format: date-time

  400:
    description: Invalid parameters
  401:
    description: Unauthorized
  500:
    description: Server error



---
tags:
  - Salon
summary: Update a pending salon application
description: >
  Allows a salon owner to modify a pending application.  
  Updates contact info, description, images, timezone, and business hours.
consumes:
  - application/json
  - multipart/form-data
produces:
  - application/json
parameters:
  - in: header
    name: Authorization
    description: Bearer access token (salon_owner)
    required: true
    type: string
  - in: path
    name: salon_id
    type: string
    format: uuid
    required: true
    description: Salon application to update
  - in: formData
    name: name
    type: string
    required: false
    example: "Updated Salon Name"
  - in: formData
    name: address
    type: string
    required: false
    example: "456 Market St"
  - in: formData
    name: city
    type: string
    example: "Newark"
  - in: formData
    name: state
    type: string
    example: "NJ"
  - in: formData
    name: zip_code
    type: string
    example: "07102"
  - in: formData
    name: phone
    type: string
    example: "9735551234"
  - in: formData
    name: email
    type: string
    example: "owner@salon.com"
  - in: formData
    name: description
    type: string
    example: "Updated description"
  - in: formData
    name: timezone
    type: string
    example: "America/New_York"
  - in: formData
    name: logo
    type: file
    description: Optional logo upload
  - in: formData
    name: license
    type: file
    description: Optional license upload
  - in: formData
    name: hours
    type: string
    description: >
      JSON string array of weekly hours. Omitted days auto-set to closed.  
      Example: `[{"day_of_week":1,"open_time":"09:00","close_time":"18:00","is_closed":false}]`
  - in: body
    name: body
    required: false
    schema:
      type: object
      properties:
        name:
          type: string
        address:
          type: string
        city:
          type: string
        state:
          type: string
        zip_code:
          type: string
        phone:
          type: string
        email:
          type: string
        description:
          type: string
        timezone:
          type: string
        hours:
          type: array
          items:
            type: object
            required: [day_of_week, is_closed]
            properties:
              day_of_week:
                type: integer
              open_time:
                type: string
              close_time:
                type: string
              is_closed:
                type: boolean

responses:
  200:
    description: Application updated
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Application updated successfully"
        status:
          type: string
          example: "pending"
  400:
    description: Invalid status or bad input
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Only pending applications can be updated."
  403:
    description: Forbidden for non-owners
    schema:
      type: object
      properties:
        error:
          type: string
          example: "You are not authorized to update this salon."
  404:
    description: Salon not found
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Salon not found"
  500:
    description: Server error
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Database connection failed"

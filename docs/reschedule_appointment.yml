---
tags:
  - Appointments
summary: Reschedule an appointment
description: >
  Updates an appointment's start time, end time, salon, and barber.  
  Automatically recalculates end time if omitted, validates overlap and availability.
consumes:
  - application/json
produces:
  - application/json
parameters:
  - in: header
    name: Authorization
    type: string
    required: true
    example: "Bearer eyJhbGciOi..."

  - in: path
    name: appointment_id
    type: string
    required: true
    description: Appointment ID
    example: "a1b2c3"

  - in: body
    name: body
    required: true
    schema:
      type: object
      required: [start_at, salon_id, barber_id]
      properties:
        start_at:
          type: string
          format: date-time
          example: "2025-11-13T14:00:00Z"
        end_at:
          type: string
          format: date-time
          description: Optional; calculated if missing
          example: "2025-11-13T14:30:00Z"
        salon_id:
          type: string
          example: "salon-22"
        barber_id:
          type: string
          example: "barb-111"

responses:
  200:
    description: Appointment rescheduled successfully
    schema:
      type: object
      properties:
        id: { type: string, example: "a1b2c3" }
        status: { type: string, example: "rescheduled" }
        start_at: { type: string, example: "2025-11-13T14:00:00Z" }
        end_at: { type: string, example: "2025-11-13T14:30:00Z" }

  400:
    description: Bad request or unavailable
    schema:
      type: object
      properties:
        error: { type: string, example: "Barber unavailable during requested hours" }

  403:
    description: Forbidden
    schema:
      type: object
      properties:
        error: { type: string, example: "Forbidden" }

  404:
    description: Appointment not found
    schema:
      type: object
      properties:
        error: { type: string, example: "Appointment not found" }

  500:
    description: Server error
    schema:
      type: object
      properties:
        error: { type: string, example: "Internal server error" }

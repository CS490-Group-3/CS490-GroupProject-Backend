---
tags:
  - Owner
summary: Get loyalty program configuration
description: >
  Get loyalty program configuration for the salon owner's salon.
  Only salon owners and admins can access this.
produces:
  - application/json
parameters:
  - in: header
    name: Authorization
    type: string
    required: true
    description: Bearer access token
    example: "Bearer eyJhbGciOi..."

responses:
  200:
    description: Loyalty program configuration
    schema:
      type: object
      properties:
        pointsPerDollar:
          type: number
          format: float
          description: Points earned per dollar spent
          example: 1.0
        pointThreshold:
          type: integer
          description: Minimum points required for redemption
          example: 100
        rewardDiscount:
          type: integer
          description: Discount percentage when redeeming points
          example: 10
        is_active:
          type: boolean
          description: Whether the loyalty program is active
          example: true

  404:
    description: Salon not found
  401:
    description: Unauthorized
  403:
    description: Forbidden - not a salon owner
  500:
    description: Server error










---
tags:
  - Appointments
summary: Cancel an appointment
description: >
  Cancels an appointment and sets its status to **cancelled**.  
  Only the appointment owner or authorized staff can perform this.
consumes:
  - application/json
produces:
  - application/json
parameters:
  - in: header
    name: Authorization
    required: true
    type: string
    example: "Bearer eyJhbGciOi..."

  - in: path
    name: appointment_id
    type: string
    required: true
    description: Appointment ID
    example: "a1b2c3"

  - in: body
    name: body
    required: false
    schema:
      type: object
      properties:
        reason:
          type: string
          example: "Customer is sick"

responses:
  200:
    description: Appointment cancelled
    schema:
      type: object
      properties:
        id: { type: string, example: "a1b2c3" }
        status: { type: string, example: "cancelled" }
        cancellation_reason: { type: string, example: "Customer is sick" }

  400:
    description: Invalid request
    schema:
      type: object
      properties:
        error: { type: string, example: "Appointment not found" }

  403:
    description: Forbidden
    schema:
      type: object
      properties:
        error: { type: string, example: "Forbidden" }

  404:
    description: Not found
    schema:
      type: object
      properties:
        error: { type: string, example: "Appointment not found" }

  500:
    description: Server error
    schema:
      type: object
      properties:
        error: { type: string, example: "Internal server error" }

---
tags:
  - Schedule
summary: Update a blocked window (unavailability)
description: >
  Modify an existing one-off blocked window.  
  Cannot overlap other blocks or active appointments.
consumes:
  - application/json
produces:
  - application/json
parameters:
  - in: header
    name: Authorization
    type: string
    required: true
    description: Bearer access token
    example: "Bearer eyJhbGciOi..."

  - in: path
    name: block_id
    type: string
    required: true
    description: Block (barber_unavailability) UUID
    example: "4f2e6d3b-7c0e-4f6b-9a12-1d2f3a4b5c6d"

  - in: body
    name: body
    required: true
    schema:
      type: object
      properties:
        barber_id:
          type: string
          description: Barber UUID (admins/owners may specify; barbers are forced to their own id)
          example: "7a0f4671-38ca-4286-88c6-5a309a9ed7df"
        start_datetime:
          type: string
          description: ISO timestamp (UTC or with offset)
          example: "2024-08-10T15:00:00Z"
        end_datetime:
          type: string
          description: ISO timestamp (UTC or with offset)
          example: "2024-08-10T17:00:00Z"
        reason:
          type: string
          required: false
          example: "Extended appointment"

responses:
  200:
    description: Block updated
    schema:
      type: object
      properties:
        message: { type: string, example: "Blocked time updated successfully." }
        block:
          type: object
          properties:
            id: { type: string, example: "4f2e6d3b-7c0e-4f6b-9a12-1d2f3a4b5c6d" }
            barber_id: { type: string, example: "7a0f4671-38ca-4286-88c6-5a309a9ed7df" }
            start_datetime: { type: string, example: "2024-08-10T15:00:00Z" }
            end_datetime: { type: string, example: "2024-08-10T17:00:00Z" }
            reason: { type: string, example: "Extended appointment" }
            created_at: { type: string, example: "2024-07-15T18:22:11Z" }

  400:
    description: Validation error, overlap, or missing block
    schema:
      type: object
      properties:
        error: { type: string, example: "Updated block overlaps another blocked time" }

  403:
    description: Forbidden (role mismatch or barber mismatch)
    schema:
      type: object
      properties:
        error: { type: string, example: "Forbidden" }

  500:
    description: Server error
    schema:
      type: object
      properties:
        error: { type: string, example: "Unexpected error" }

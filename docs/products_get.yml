---
tags:
  - Products
summary: Get a product by ID
description: >
  Retrieve details of a specific product.
produces:
  - application/json
parameters:
  - in: header
    name: Authorization
    type: string
    required: true
    description: Bearer access token
    example: "Bearer eyJhbGciOi..."

  - in: path
    name: product_id
    type: string
    format: uuid
    required: true
    description: Product UUID
    example: "a1234567-89ab-cdef-0123-456789abcdef"

responses:
  200:
    description: Product details
    schema:
      type: object
      properties:
        product:
          type: object
          properties:
            id:
              type: string
              format: uuid
            salon_id:
              type: string
              format: uuid
            name:
              type: string
            description:
              type: string
            price:
              type: number
              format: float
            image_url:
              type: string
            category_id:
              type: string
              format: uuid
            is_active:
              type: boolean

  404:
    description: Product not found
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Product not found"

  401:
    description: Unauthorized
  500:
    description: Server error










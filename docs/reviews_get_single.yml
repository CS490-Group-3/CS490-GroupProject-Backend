---
tags:
  - Reviews
summary: Get a full review including images and barber/owner response
description: >
  Returns the review, associated images, and optional salon owner or barber response.
produces:
  - application/json

parameters:
  - in: header
    name: Authorization
    description: Bearer access token
    required: true
    type: string

  - in: path
    name: review_id
    type: string
    format: uuid
    required: true
    description: Review ID

responses:
  200:
    description: Full review data returned
    schema:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        appointment_id: { type: string, format: uuid }
        salon_id: { type: string, format: uuid }
        rating: { type: integer, minimum: 1, maximum: 5 }
        title: { type: string }
        comment: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        images: { type: array, items: { type: object } }
        response: { type: object }
  404:
    description: Review not found
    schema:
      type: object
      properties:
        error: { type: string, example: "Review not found" }
  500:
    description: Internal server error
    schema:
      type: object
      properties:
        error: { type: string, example: "Internal server error" }


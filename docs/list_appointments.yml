---
tags:
  - Appointments
summary: List appointments for the current user
description: >
  Returns a paginated list of appointments visible to the authenticated user.  
  Role behavior:
  - **Customer:** Their own appointments  
  - **Barber:** Appointments assigned to them  
  - **Salon Owner:** All appointments for their owned salons  
  - **Admin:** All appointments with optional filters
produces:
  - application/json
parameters:
  - in: header
    name: Authorization
    type: string
    required: true
    description: Bearer access token
    example: "Bearer eyJhbGciOi..."

  - in: query
    name: when
    type: string
    enum: [upcoming, past, all]
    default: all
    description: Filter by time window

  - in: query
    name: status
    type: string
    description: Comma-separated statuses (e.g., `scheduled,cancelled`)

  - in: query
    name: page
    type: integer
    default: 1
    description: Page number (pagination)

  - in: query
    name: limit
    type: integer
    default: 20
    description: Results per page

  - in: query
    name: salon_id
    type: string
    description: Admin-only filter

  - in: query
    name: barber_id
    type: string
    description: Admin-only filter

  - in: query
    name: customer_id
    type: string
    description: Admin-only filter

responses:
  200:
    description: List of appointments
    schema:
      type: object
      properties:
        when:
          type: string
          example: "upcoming"
        status_filter:
          type: string
          example: "scheduled"
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        count:
          type: integer
          example: 2
        appointments:
          type: array
          items:
            type: object
            properties:
              id: { type: string, example: "a1b2c3" }
              customer_id: { type: string, example: "cust-123" }
              barber_id: { type: string, example: "barb-111" }
              service_id: { type: string, example: "svc-9" }
              salon_id: { type: string, example: "salon-22" }
              start_at: { type: string, format: date-time, example: "2025-11-12T15:00:00Z" }
              end_at: { type: string, format: date-time, example: "2025-11-12T15:30:00Z" }
              status: { type: string, example: "scheduled" }
              notes: { type: string, example: "Fade + beard" }

  400:
    description: Bad request
    schema:
      type: object
      properties:
        error: { type: string, example: "Invalid query parameter" }

  403:
    description: Forbidden
    schema:
      type: object
      properties:
        error: { type: string, example: "Unauthorized role" }

  500:
    description: Server error
    schema:
      type: object
      properties:
        error: { type: string, example: "Internal server error" }

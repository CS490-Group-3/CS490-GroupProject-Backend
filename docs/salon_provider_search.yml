---
tags:
  - Salon
summary: Search providers to add to a salon
description: >
  Allows admins or salon owners to search for barbers by email before adding them to a salon.
produces:
  - application/json
parameters:
  - in: header
    name: Authorization
    description: Bearer access token
    required: true
    type: string

  - in: query
    name: email
    type: string
    required: true
    description: Case-insensitive substring search on provider email
    example: "barber@example.com"

responses:
  200:
    description: Matching providers
    schema:
      type: object
      properties:
        providers:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              email:
                type: string
                example: "barber@example.com"
              first_name:
                type: string
                example: "Jordan"
              last_name:
                type: string
                example: "Lee"
  400:
    description: Missing search query
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Missing search query parameter 'email'"
  404:
    description: No providers found
    schema:
      type: object
      properties:
        error:
          type: string
          example: "No service providers found matching the search criteria"
  500:
    description: Unexpected server error
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Database connection failed"

---
tags:
  - Salon
summary: Remove a service from a barber
description: >
  Removes a service assignment from a barber. Validates that the salon owner owns the salon,
  the barber belongs to the salon, and the service belongs to the salon.
  Only salon owners and admins may perform this action.
consumes:
  - application/json
produces:
  - application/json
parameters:
  - in: header
    name: Authorization
    type: string
    required: true
    description: Bearer access token
    example: "Bearer eyJhbGciOi..."

  - in: path
    name: salon_id
    type: string
    format: uuid
    required: true
    description: Salon UUID
    example: "b534633a-23bc-4479-968f-8a004615821c"

  - in: path
    name: barber_id
    type: string
    format: uuid
    required: true
    description: Barber UUID
    example: "a1234567-89ab-cdef-0123-456789abcdef"

  - in: path
    name: service_id
    type: string
    format: uuid
    required: true
    description: Service UUID to remove from the barber
    example: "f9876543-21ba-fedc-3210-fedcba987654"

responses:
  200:
    description: Service removed from barber successfully
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Service removed from barber successfully"

  400:
    description: Validation error or business logic error
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Service is not assigned to this barber"

  403:
    description: Forbidden - salon ownership or access denied
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Forbidden: You don't own this salon"

  404:
    description: Salon, barber, or service not found
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Barber not found"

  500:
    description: Server error
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Unexpected error occurred"


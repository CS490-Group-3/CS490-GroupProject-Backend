---
tags:
  - Appointments
summary: Confirm or deny an appointment
description: >
  Allows an admin, salon owner, or assigned barber to confirm or deny an appointment.
consumes:
  - application/json
produces:
  - application/json
parameters:
  - in: header
    name: Authorization
    required: true
    type: string
    example: "Bearer eyJhbGciOi..."

  - in: path
    name: appointment_id
    type: string
    required: true
    description: Appointment ID
    example: "a1b2c3"

  - in: body
    name: body
    required: true
    schema:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [confirm, deny]
          example: "confirm"

responses:
  200:
    description: Appointment updated successfully
    schema:
      type: object
      properties:
        id: { type: string, example: "a1b2c3" }
        status: { type: string, example: "scheduled" }

  400:
    description: Invalid action
    schema:
      type: object
      properties:
        error: { type: string, example: "Invalid action" }

  403:
    description: Forbidden
    schema:
      type: object
      properties:
        error: { type: string, example: "Forbidden" }

  404:
    description: Appointment not found
    schema:
      type: object
      properties:
        error: { type: string, example: "Appointment not found" }

  500:
    description: Server error
    schema:
      type: object
      properties:
        error: { type: string, example: "Internal server error" }

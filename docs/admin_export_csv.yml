---
tags:
  - Admin
summary: Export metrics to CSV
description: >
  Export metrics data to CSV format for download.
  Supports all metrics types: engagement, appointments, revenue, loyalty, retention, demographics, platform.
parameters:
  - in: header
    name: Authorization
    required: true
    schema:
      type: string
  - in: path
    name: metrics_type
    required: true
    schema:
      type: string
      enum: [engagement, appointments, revenue, loyalty, retention, demographics, platform]
    description: Type of metrics to export
  - in: query
    name: start_date
    schema:
      type: string
      format: date
    description: Start date (required for date-range metrics)
    example: "2024-01-01"
  - in: query
    name: end_date
    schema:
      type: string
      format: date
    description: End date (required for date-range metrics)
    example: "2024-01-31"
responses:
  200:
    description: CSV file download
    schema:
      type: file
  400:
    description: Bad request
  403:
    description: Forbidden
  500:
    description: Internal server error


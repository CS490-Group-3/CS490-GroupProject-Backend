---
tags:
  - Orders
summary: Update order status (owner only)
description: >
  Update the status of an order. Only accessible by the salon owner.
consumes:
  - application/json
produces:
  - application/json
parameters:
  - in: header
    name: Authorization
    type: string
    required: true
    description: Bearer access token
    example: "Bearer eyJhbGciOi..."

  - in: path
    name: order_id
    type: string
    format: uuid
    required: true
    description: Order ID
    example: "a1234567-89ab-cdef-0123-456789abcdef"

  - in: body
    name: body
    required: true
    schema:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [confirmed, processing, shipped, delivered, cancelled]
          description: New order status
          example: "processing"

responses:
  200:
    description: Order status updated successfully
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Order status updated"
        order:
          type: object
          properties:
            id:
              type: string
            order_status:
              type: string

  400:
    description: Invalid request
  403:
    description: Unauthorized - not the salon owner
  404:
    description: Order not found
  500:
    description: Server error


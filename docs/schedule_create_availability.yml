---
tags:
  - Schedule
summary: Create barber weekly availability
description: >
  Allows a barber (or admin/salon owner acting on their behalf) to define weekly availability blocks.  
  Each block specifies the day of week, start time, end time, and whether it is active.
consumes:
  - application/json
produces:
  - application/json
parameters:
  - in: header
    name: Authorization
    type: string
    required: true
    description: Bearer access token
    example: "Bearer eyJhbGciOi..."

  - in: body
    name: body
    required: true
    schema:
      type: object
      required: [availability]
      properties:
        availability:
          type: array
          description: List of availability blocks to create
          items:
            type: object
            required: [day_of_week, start_time, end_time]
            properties:
              day_of_week:
                type: integer
                description: 0 = Sunday ... 6 = Saturday
                example: 1
              start_time:
                type: string
                description: HH:MM or HH:MM:SS (24h)
                example: "09:00"
              end_time:
                type: string
                description: HH:MM or HH:MM:SS (24h)
                example: "13:00"
              is_active:
                type: boolean
                default: true
                example: true

responses:
  201:
    description: Availability saved
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Availability created successfully."

  400:
    description: Validation error or missing payload
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Missing 'availability' in request body"

  500:
    description: Server error
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Failed to create availability"

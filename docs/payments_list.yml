---
tags:
  - Payments
summary: List payments for the current user
description: >
  Get payment history for the authenticated user.
  Supports filtering by date range and pagination.
produces:
  - application/json
parameters:
  - in: header
    name: Authorization
    type: string
    required: true
    description: Bearer access token
    example: "Bearer eyJhbGciOi..."

  - in: query
    name: start_date
    type: string
    format: date
    required: false
    description: Start date for filtering (YYYY-MM-DD)
    example: "2024-01-01"

  - in: query
    name: end_date
    type: string
    format: date
    required: false
    description: End date for filtering (YYYY-MM-DD)
    example: "2024-12-31"

  - in: query
    name: limit
    type: integer
    required: false
    default: 100
    description: Maximum number of results
    example: 50

  - in: query
    name: offset
    type: integer
    required: false
    default: 0
    description: Number of results to skip
    example: 0

responses:
  200:
    description: List of payments
    schema:
      type: object
      properties:
        payments:
          type: array
          items:
            type: object

  400:
    description: Invalid parameters
  401:
    description: Unauthorized
  500:
    description: Server error




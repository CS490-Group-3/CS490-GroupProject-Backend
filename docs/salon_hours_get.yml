---
tags:
  - Salon
summary: Get salon business hours
description: >
  Returns the weekly hours for a salon. Owner or admin access required.
produces:
  - application/json
parameters:
  - in: header
    name: Authorization
    description: Bearer access token
    required: true
    type: string

  - in: path
    name: salon_id
    type: string
    format: uuid
    required: true
    description: Salon ID to fetch hours for
    example: "b534633a-23bc-4479-968f-8a004615821c"

responses:
  200:
    description: Hours retrieved
    schema:
      type: object
      properties:
        hours:
          type: array
          items:
            type: object
            properties:
              salon_id:
                type: string
                format: uuid
              day_of_week:
                type: integer
                example: 1
              open_time:
                type: string
                example: "09:00:00"
              close_time:
                type: string
                example: "18:00:00"
              is_closed:
                type: boolean
                example: false
  403:
    description: Forbidden for non-owners
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Forbidden: You don't own this salon"
  404:
    description: Salon not found
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Salon not found"
  500:
    description: Server error
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Database connection failed"

---
tags:
  - Services
summary: Update a service
description: >
  Updates a service's details. Validates that the salon owner owns the salon
  and the service belongs to the salon. Only salon owners and admins may perform this action.
consumes:
  - application/json
produces:
  - application/json
parameters:
  - in: header
    name: Authorization
    type: string
    required: true
    description: Bearer access token
    example: "Bearer eyJhbGciOi..."

  - in: path
    name: service_id
    type: string
    format: uuid
    required: true
    description: Service UUID to update
    example: "f9876543-21ba-fedc-3210-fedcba987654"

  - in: body
    name: body
    required: true
    schema:
      type: object
      required: [salon_id]
      properties:
        salon_id:
          type: string
          format: uuid
          description: Salon UUID that owns the service
          example: "b534633a-23bc-4479-968f-8a004615821c"
        name:
          type: string
          example: "Premium Haircut"
        description:
          type: string
          example: "Full service haircut with styling"
        duration_minutes:
          type: integer
          example: 45
        price:
          type: string
          example: "50.00"
        is_active:
          type: boolean
          example: true
    example:
      salon_id: "b534633a-23bc-4479-968f-8a004615821c"
      name: "Premium Haircut"
      description: "Full service haircut with styling"
      duration_minutes: 45
      price: "50.00"
      is_active: true

responses:
  200:
    description: Service updated successfully
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Service updated successfully"

  400:
    description: Validation error or missing salon_id
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Missing salon_id"

  403:
    description: Forbidden - salon ownership required
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Forbidden: You don't own this salon"

  404:
    description: Service not found
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Service not found"

  500:
    description: Server error
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Unexpected error occurred"


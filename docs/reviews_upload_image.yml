---
tags:
  - Reviews
summary: Upload an image for a review.
description: Upload a PNG or JPEG image to attach to a review.
consumes:
  - multipart/form-data
produces:
  - application/json

parameters:
  - in: header
    name: Authorization
    type: string
    required: true
    description: Bearer access token

  - in: path
    name: review_id
    type: string
    required: true
    description: The ID of the review

  - in: formData
    name: files
    type: array
    items:
      type: file
    required: true
    description: Multiple image file (PNG, JPG)
  - in: formData
    name: labels
    type: array
    items:
      type: string
    required: false
    description: Optional labels corresponding to each uploaded file

responses:
  200:
    description: File uploaded successfully
  400:
    description: Missing file
  403:
    description: Unauthorized user
  500:
    description: Internal server error


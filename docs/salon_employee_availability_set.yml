---
tags:
  - Salon
summary: Set or update a barber's availability
description: >
  Creates or updates weekly availability blocks for a barber.
  Salon owners can set their employees' schedules.
  Availability must be within salon hours for that day.
  Validates that the salon owner owns the salon and the barber belongs to the salon.
consumes:
  - application/json
produces:
  - application/json
parameters:
  - in: header
    name: Authorization
    type: string
    required: true
    description: Bearer access token
    example: "Bearer eyJhbGciOi..."

  - in: path
    name: salon_id
    type: string
    format: uuid
    required: true
    description: Salon UUID
    example: "b534633a-23bc-4479-968f-8a004615821c"

  - in: path
    name: barber_id
    type: string
    format: uuid
    required: true
    description: Barber UUID
    example: "a1234567-89ab-cdef-0123-456789abcdef"

  - in: body
    name: body
    required: true
    schema:
      type: object
      required: [availability]
      properties:
        availability:
          type: array
          description: List of availability blocks (POST creates new, PATCH updates existing)
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Required for PATCH, omit for POST
              day_of_week:
                type: integer
                description: 0 = Sunday ... 6 = Saturday
                example: 1
              start_time:
                type: string
                description: HH:MM or HH:MM:SS (24h)
                example: "09:00"
              end_time:
                type: string
                description: HH:MM or HH:MM:SS (24h)
                example: "17:00"
              is_active:
                type: boolean
                default: true
                example: true
    example:
      availability:
        - day_of_week: 1
          start_time: "09:00"
          end_time: "17:00"
          is_active: true
        - day_of_week: 2
          start_time: "09:00"
          end_time: "17:00"
          is_active: true

responses:
  201:
    description: Availability created successfully (POST)
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Availability created successfully"

  200:
    description: Availability updated successfully (PATCH)
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Availability updated successfully"

  400:
    description: Validation error or availability outside salon hours
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Availability must be within salon hours (09:00:00 - 17:00:00)"

  403:
    description: Forbidden - salon ownership required
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Forbidden: You don't own this salon"

  404:
    description: Salon or barber not found
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Barber not found"

  500:
    description: Server error
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Unexpected error occurred"


---
tags:
  - Admin
summary: Get loyalty metrics
description: >
  Retrieve loyalty program metrics for a date range including points earned,
  points redeemed, and active members.
parameters:
  - in: header
    name: Authorization
    required: true
    schema:
      type: string
  - in: query
    name: start_date
    required: true
    schema:
      type: string
      format: date
    example: "2024-01-01"
  - in: query
    name: end_date
    required: true
    schema:
      type: string
      format: date
    example: "2024-01-31"
responses:
  200:
    description: Loyalty metrics retrieved successfully
    schema:
      type: object
  400:
    description: Bad request
  403:
    description: Forbidden
  500:
    description: Internal server error


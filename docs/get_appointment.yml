---
tags:
  - Appointments
summary: Get appointment by ID
description: >
  Retrieves details for a specific appointment if the user is authorized to view it.
produces:
  - application/json
parameters:
  - in: header
    name: Authorization
    required: true
    type: string
    example: "Bearer eyJhbGciOi..."

  - in: path
    name: appointment_id
    type: string
    required: true
    example: "a1b2c3"

responses:
  200:
    description: Appointment retrieved successfully
    schema:
      type: object
      properties:
        id: { type: string, example: "a1b2c3" }
        customer_id: { type: string, example: "cust-123" }
        barber_id: { type: string, example: "barb-111" }
        service_id: { type: string, example: "svc-9" }
        salon_id: { type: string, example: "salon-22" }
        start_at: { type: string, example: "2025-11-12T15:00:00Z" }
        end_at: { type: string, example: "2025-11-12T15:30:00Z" }
        status: { type: string, example: "scheduled" }
        notes: { type: string, example: "Fade + beard" }
        cancellation_reason: { type: string, example: null }
        created_at: { type: string, example: "2025-11-10T19:00:00Z" }
        updated_at: { type: string, example: "2025-11-10T19:00:00Z" }

  403:
    description: Forbidden
    schema:
      type: object
      properties:
        error: { type: string, example: "Forbidden" }

  404:
    description: Appointment not found
    schema:
      type: object
      properties:
        error: { type: string, example: "Appointment not found" }

  500:
    description: Server error
    schema:
      type: object
      properties:
        error: { type: string, example: "Internal server error" }

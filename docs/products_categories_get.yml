---
tags:
  - Products
summary: Get a product category by ID
description: >
  Retrieve details of a specific product category.
produces:
  - application/json
parameters:
  - in: header
    name: Authorization
    type: string
    required: true
    description: Bearer access token
    example: "Bearer eyJhbGciOi..."

  - in: path
    name: category_id
    type: string
    format: uuid
    required: true
    description: Category UUID
    example: "a1234567-89ab-cdef-0123-456789abcdef"

responses:
  200:
    description: Category details
    schema:
      type: object
      properties:
        data:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            description:
              type: string
            parent_category_id:
              type: string
              format: uuid

  404:
    description: Category not found
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Category not found"

  401:
    description: Unauthorized
  500:
    description: Server error










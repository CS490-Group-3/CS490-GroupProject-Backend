---
tags:
  - Salon
summary: Get a barber's availability
description: >
  Returns the weekly availability blocks for a barber.
  Salon owners can view their employees' schedules.
  Validates that the salon owner owns the salon and the barber belongs to the salon.
consumes:
  - application/json
produces:
  - application/json
parameters:
  - in: header
    name: Authorization
    type: string
    required: true
    description: Bearer access token
    example: "Bearer eyJhbGciOi..."

  - in: path
    name: salon_id
    type: string
    format: uuid
    required: true
    description: Salon UUID
    example: "b534633a-23bc-4479-968f-8a004615821c"

  - in: path
    name: barber_id
    type: string
    format: uuid
    required: true
    description: Barber UUID
    example: "a1234567-89ab-cdef-0123-456789abcdef"

responses:
  200:
    description: Barber availability retrieved successfully
    schema:
      type: object
      properties:
        availability:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              barber_id:
                type: string
                format: uuid
              day_of_week:
                type: integer
                description: 0 = Sunday ... 6 = Saturday
              start_time:
                type: string
                example: "09:00:00"
              end_time:
                type: string
                example: "17:00:00"
              is_active:
                type: boolean

  400:
    description: Error retrieving availability
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Availability not configured"

  403:
    description: Forbidden - salon ownership required
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Forbidden: You don't own this salon"

  404:
    description: Salon or barber not found
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Barber not found"

  500:
    description: Server error
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Unexpected error occurred"


---
tags:
  - Salon Promotions
summary: "Create a promotional offer and notify eligible users"
description: >
  Allows **salon owners** or **admins** to create a new promotional offer for a salon.
  The system automatically notifies eligible users (either existing customers or all users)
  and creates records in `promotional_offers`, `promotional_recipients`, and `notifications`.
consumes:
  - application/json
produces:
  - application/json
parameters:
  - in: path
    name: salon_id
    type: string
    format: uuid
    required: true
    description: "The UUID of the salon creating the promotion."
  - in: header
    name: Authorization
    description: "Bearer access token (owner or admin)"
    required: true
    type: string
  - in: body
    name: body
    required: true
    schema:
      type: object
      required:
        - title
        - description
        - discount_type
        - discount_value
        - valid_from
        - valid_until
      properties:
        title:
          type: string
          example: "Holiday Blowout Sale"
        description:
          type: string
          example: "20% off all services this weekend at Fade Masters!"
        discount_type:
          type: string
          enum: [percentage]
          example: "percentage"
        discount_value:
          type: number
          example: 20
        min_purchase_amount:
          type: number
          example: 0
        valid_from:
          type: string
          format: date-time
          example: "2025-11-10T00:00:00Z"
        valid_until:
          type: string
          format: date-time
          example: "2025-11-17T23:59:00Z"
        target_audience:
          type: string
          enum: [existing_customers, all_users]
          default: "existing_customers"
          example: "existing_customers"
responses:
  201:
    description: "Promotional offer successfully created and notifications sent."
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Offer created and notifications sent to existing_customers."
        offer_id:
          type: string
          format: uuid
  207:
    description: "Offer created but notifications partially failed."
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Offer created but notifications failed."
        offer_id:
          type: string
          format: uuid
        error:
          type: string
          example: "Supabase insert timeout"
  400:
    description: "Invalid or missing input data."
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Missing fields: title, description"
  500:
    description: "Unexpected server or database error."
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Database insert failed: connection timeout"


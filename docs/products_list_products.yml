---
tags:
  - Products
summary: List products globally or for a specific salon
description: Retrieve a list of products. Can filter by salon and optionally by category.
parameters:
  - in: header
    name: Authorization
    required: true
    schema:
      type: string
  - in: query
    name: salon_id
    required: true
    schema:
      type: string
      format: uuid
    description: Salon ID
    example: "123e4567-e89b-12d3-a456-426614174000"
  - in: query
    name: category_id
    required: false
    schema:
      type: array
      items:
        type: string
        format: uuid
    description: Filter by category IDs (can specify multiple)
    example: ["123e4567-e89b-12d3-a456-426614174001"]
responses:
  200:
    description: Products retrieved successfully
    schema:
      type: object
      properties:
        products:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              salon_id:
                type: string
                format: uuid
              category_id:
                type: string
                format: uuid
                nullable: true
              name:
                type: string
              description:
                type: string
                nullable: true
              price:
                type: number
                format: float
              stock_quantity:
                type: integer
                nullable: true
              image_url:
                type: string
                nullable: true
              is_active:
                type: boolean
              created_at:
                type: string
                format: date-time
              updated_at:
                type: string
                format: date-time
                nullable: true
        message:
          type: string
          description: Present when no products found
          example: "No products found"
  400:
    description: Bad request - missing salon_id
  500:
    description: Internal server error
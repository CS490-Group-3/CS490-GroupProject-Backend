---
tags:
  - Products
summary: List products globally or for a specific salon
description: Retrieve a list of products. Can filter by salon and optionally by category.
parameters:
  - in: header
    name: Authorization
    required: true
    schema:
      type: string
  - in: query
    name: salon_id
    required: true
    schema:
      type: string
      format: uuid
    description: Salon ID
    example: "123e4567-e89b-12d3-a456-426614174000"
  - in: query
    name: category_id
    required: false
    schema:
      type: array
      items:
        type: string
        format: uuid
    description: Filter by category IDs (can specify multiple)
    example: ["123e4567-e89b-12d3-a456-426614174001"]
responses:
  200:
    description: Products retrieved successfully
    schema:
      type: object
      properties:
        products:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              price:
                type: number
                format: float
              # Add other properties as needed
  400:
    description: Bad request - missing salon_id
  500:
    description: Internal server error
---
tags:
  - Schedule
summary: List barber blocked times (unavailability)
description: >
  Returns one-off blocked windows for a barber (vacation, sick, etc.).  
  Customers are not allowed; only the barber, an admin, or a salon owner.
produces:
  - application/json
parameters:
  - in: header
    name: Authorization
    type: string
    required: true
    description: Bearer access token
    example: "Bearer eyJhbGciOi..."

  - in: query
    name: barber_id
    type: string
    required: false
    description: >
      Barber UUID (required for admins/owners if not acting as a barber themselves; ignored for barbers).
    example: "7a0f4671-38ca-4286-88c6-5a309a9ed7df"

  - in: query
    name: start_from
    type: string
    required: false
    description: Return blocks that end after this ISO timestamp (UTC or offset).
    example: "2024-08-01T00:00:00Z"

  - in: query
    name: end_before
    type: string
    required: false
    description: Return blocks that start before this ISO timestamp (UTC or offset).
    example: "2024-09-01T00:00:00Z"

responses:
  200:
    description: Blocked windows retrieved successfully
    schema:
      type: object
      properties:
        barber_id: { type: string, example: "7a0f4671-38ca-4286-88c6-5a309a9ed7df" }
        count: { type: integer, example: 2 }
        blocks:
          type: array
          items:
            type: object
            properties:
              id: { type: string, example: "4f2e6d3b-7c0e-4f6b-9a12-1d2f3a4b5c6d" }
              barber_id: { type: string, example: "7a0f4671-38ca-4286-88c6-5a309a9ed7df" }
              start_datetime: { type: string, example: "2024-08-10T14:00:00Z" }
              end_datetime: { type: string, example: "2024-08-10T16:30:00Z" }
              reason: { type: string, example: "Doctor appointment" }
              created_at: { type: string, example: "2024-07-15T18:22:11Z" }

  400:
    description: Validation/lookup error
    schema:
      type: object
      properties:
        error: { type: string, example: "Missing barber_id parameter" }

  403:
    description: Forbidden (role mismatch or barber mismatch)
    schema:
      type: object
      properties:
        error: { type: string, example: "Forbidden" }

  500:
    description: Server error
    schema:
      type: object
      properties:
        error: { type: string, example: "Unexpected error" }

---
tags:
  - Salon Promotions
summary: Get active promotions for a salon
description: >
  Get active promotional offers for a salon (customer-facing).
  Only returns promotions the current user is eligible for based on
  their purchase history and the promotion's target audience.
parameters:
  - in: path
    name: salon_id
    type: string
    format: uuid
    required: true
    description: The UUID of the salon
  - in: header
    name: Authorization
    description: Bearer access token
    required: true
    type: string
  - in: query
    name: purchase_amount
    type: number
    format: float
    required: false
    default: 0
    description: Current purchase amount to check eligibility
    example: 50.00
produces:
  - application/json
responses:
  200:
    description: Active promotions retrieved successfully
    schema:
      type: object
      properties:
        promotions:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              title:
                type: string
              description:
                type: string
              discount_type:
                type: string
              discount_value:
                type: number
              min_purchase_amount:
                type: number
              valid_from:
                type: string
                format: date-time
              valid_until:
                type: string
                format: date-time
  400:
    description: Bad request
  401:
    description: Unauthorized
  500:
    description: Internal server error


---
tags:
  - Orders
summary: Cancel order (customer only)
description: >
  Cancel an order. Only pending or confirmed orders can be cancelled.
  Payment will be refunded and loyalty points earned will be removed.
consumes:
  - application/json
produces:
  - application/json
parameters:
  - in: header
    name: Authorization
    type: string
    required: true
    description: Bearer access token
    example: "Bearer eyJhbGciOi..."

  - in: path
    name: order_id
    type: string
    format: uuid
    required: true
    description: Order ID
    example: "a1234567-89ab-cdef-0123-456789abcdef"

  - in: body
    name: body
    required: false
    schema:
      type: object
      properties:
        reason:
          type: string
          description: Optional cancellation reason
          example: "Changed my mind"

responses:
  200:
    description: Order cancelled successfully
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Order cancelled successfully. Payment refunded and loyalty points removed."
        order:
          type: object
          properties:
            id:
              type: string
            order_status:
              type: string
              example: "cancelled"

  400:
    description: Invalid request or order cannot be cancelled
  403:
    description: Unauthorized - order does not belong to user
  404:
    description: Order not found
  500:
    description: Server error


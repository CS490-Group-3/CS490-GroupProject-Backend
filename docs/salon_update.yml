---
tags:
  - Salon
summary: Update a verified salon's details
description: >
  Allows **salon owners** or **admins** to update a verified salon's information.
  Can update name, description, address, city, state, zip_code, phone, email, and logo.
  Supports both JSON and multipart/form-data (for logo upload).
consumes:
  - application/json
  - multipart/form-data
produces:
  - application/json
parameters:
  - in: header
    name: Authorization
    type: string
    required: true
    description: Bearer access token
    example: "Bearer eyJhbGciOi..."

  - in: path
    name: salon_id
    type: string
    format: uuid
    required: true
    description: Salon UUID to update
    example: "b534633a-23bc-4479-968f-8a004615821c"

  - in: body
    name: body
    required: true
    schema:
      type: object
      properties:
        name:
          type: string
          example: "Elite Barbershop"
        description:
          type: string
          example: "Premium haircuts and grooming services"
        address:
          type: string
          example: "123 Main St"
        city:
          type: string
          example: "New York"
        state:
          type: string
          example: "NY"
        zip_code:
          type: string
          example: "10001"
        phone:
          type: string
          example: "+1-555-123-4567"
        email:
          type: string
          format: email
          example: "contact@elitebarbershop.com"
        logo:
          type: string
          format: binary
          description: Logo image file (when using multipart/form-data)
    example:
      name: "Elite Barbershop"
      description: "Premium haircuts and grooming services"
      address: "123 Main St"
      city: "New York"
      state: "NY"
      zip_code: "10001"
      phone: "+1-555-123-4567"
      email: "contact@elitebarbershop.com"

responses:
  200:
    description: Salon updated successfully
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Salon updated successfully"
        salon:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            description:
              type: string
            logo_url:
              type: string
              nullable: true

  400:
    description: Validation error
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Invalid email format"

  403:
    description: Forbidden - salon ownership required
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Forbidden: You don't own this salon"

  404:
    description: Salon not found
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Salon not found"

  500:
    description: Server error
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Unexpected error occurred"


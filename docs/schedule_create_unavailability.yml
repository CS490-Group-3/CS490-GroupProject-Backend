---
tags:
  - Schedule
summary: Create a one-off blocked window (unavailability)
description: >
  Blocks a specific time range for a barber (e.g., vacation, sick time).  
  Bookings during this window are prevented.
consumes:
  - application/json
produces:
  - application/json
parameters:
  - in: header
    name: Authorization
    type: string
    required: true
    description: Bearer access token
    example: "Bearer eyJhbGciOi..."

  - in: body
    name: body
    required: true
    schema:
      type: object
      required: [start_datetime, end_datetime]
      properties:
        barber_id:
          type: string
          description: Barber UUID (admins/owners may specify; barbers are forced to their own id)
          example: "7a0f4671-38ca-4286-88c6-5a309a9ed7df"
        start_datetime:
          type: string
          description: ISO timestamp (UTC or with offset)
          example: "2024-08-10T14:00:00Z"
        end_datetime:
          type: string
          description: ISO timestamp (UTC or with offset); must be after start_datetime
          example: "2024-08-10T16:30:00Z"
        reason:
          type: string
          required: false
          example: "Personal appointment"

responses:
  201:
    description: Block created
    schema:
      type: object
      properties:
        block:
          type: object
          properties:
            id: { type: string, example: "4f2e6d3b-7c0e-4f6b-9a12-1d2f3a4b5c6d" }
            barber_id: { type: string, example: "7a0f4671-38ca-4286-88c6-5a309a9ed7df" }
            start_datetime: { type: string, example: "2024-08-10T14:00:00Z" }
            end_datetime: { type: string, example: "2024-08-10T16:30:00Z" }
            reason: { type: string, example: "Personal appointment" }
            created_at: { type: string, example: "2024-07-15T18:22:11Z" }

  400:
    description: Validation or overlap error
    schema:
      type: object
      properties:
        error: { type: string, example: "Requested block overlaps an existing blocked time" }

  403:
    description: Forbidden (role mismatch or barber mismatch)
    schema:
      type: object
      properties:
        error: { type: string, example: "Forbidden" }

  500:
    description: Server error
    schema:
      type: object
      properties:
        error: { type: string, example: "Unexpected error" }
